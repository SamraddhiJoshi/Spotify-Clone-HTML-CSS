    <title>FORM</title>

  <body>
    <form action="/action">
      <div>
        <label for="username">Enter your username:</label>
        <input type="text" id="username" placeholder="username" />
      </div>

      <div>
        <label for="password">Enter your password:</label>
        <input type="password" id="password" placeholder="password" name="username" />
      </div>

      <div>

      </div>

      <div>
        <input type="checkbox" id="age" name="age">
        <label for="age">I am 18+ </label>
      </div>

      <label for="vol">Select your volume</label>
      <input type="range" id="vol" name="vol" min="0" max="100" step="10" value="50">
      <button>Submit</button>

      <br>

      <label for="feedback">PLease give valuable Feedback</label>

      <div>
        Choose your profession:
        <select name="profession" id="profession" >
          <option value="stu" selected>Student</option>
          <option value="dev">Developer</option>
        </select>
      </div>

      <div>
        <input type="radio" name="fruits" id="apple" value="apple">
        <label for="apple">APPLE</label>
        <input type="radio" name="fruits" id="mango" value="mango">
        <label for="mango">MANGO</label>
        <input type="radio" name="fruits" id="pear" value="pear">
        <label for="pear">PEAR</label>
      </div>

      <div>
       <button>Submit</button>
      </div>
    </form>
