<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
  </head>
  <body>
    <form action="action/">
      <label for="Name">Name:</label>
      <input type="text" id="Name" name="Name" />
      <br />
      <div>
        Sex:
        <input type="radio" name="Sex" id="Male" value="Male" />
        <label for="Male">Male</label>
        <input type="radio" name="Sex" id="Female" value="Female" />
        <label for="Female">Female</label>
      </div>

      <div>
        Country:
        <select name="Country" id="Country">
          <option value="ind">India</option>
          <option value="jap">Japan</option>
          <option value="US">US</option>
          <option value="Fra">France</option>
        </select>
      </div>

      <div>
        Message:
        <textarea id="Message" name="Message"></textarea>
      </div>

      <div>
        <input type="checkbox" id="check" name="check" />
        <label for="check">Subscribe?</label>
      </div>

      <button>Submit</button>
    </form>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
  </head>
  <body>
    <h3>FEEDBACK FORM</h3>
    <form action="action/">
      <div>
        <label for="Name">Name: </label>
        <input
          type="text"
          id="Name"
          name="Name"
          placeholder="Write your name"
        />
      </div>
      <br />
      <div>
        <label for="Email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Write your email"
        />
      </div>
      <br />
      <div>
        <label for="Message">Message:</label>
        <textarea id="Message" name="Message"></textarea>
      </div>
      <br />
      <div>
        Rate us our of 5:
        <br />
        <label> <input type="radio" name="rating" value="1" />1 </label><br />
        <label> <input type="radio" name="rating" value="2" />2 </label><br />
        <label> <input type="radio" name="rating" value="3" />3 </label><br />
        <label> <input type="radio" name="rating" value="4" />4 </label><br />
        <label> <input type="radio" name="rating" value="5" />5 </label><br />
      </div>
      <br />
      <div>
        <button>Send your message!</button>
      </div>
    </form>
  </body>
</html>
